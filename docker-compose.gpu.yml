# Override for the real pipeline on an NVIDIA GPU (Windows + Docker Desktop/WSL2, or Linux + nvidia-container-toolkit):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# With `--profile ollama` it also starts Ollama (VLM) on the same GPU and pulls VLM_MODEL on first start (kept in a volume).
# Ollama already installed on the host instead: VLM_URL_DOCKER=http://host.docker.internal:11434 (deploy/docker.ps1 picks the profile by this).
services:
  app:
    build:
      args:
        WITH_ML: "1"
    image: phantomguard-app:gpu
    environment:
      ANALYZER: ${ANALYZER_DOCKER:-ml}
      DETECTOR_DEVICE: cuda
      HF_HUB_OFFLINE: "1"
      VLM_URL: ${VLM_URL_DOCKER:-http://ollama:11434}
    shm_size: 4gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:0.35.1
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:0.35.1
    profiles: [ollama]
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${VLM_MODEL:-qwen3.5:4b}\""]
    environment:
      OLLAMA_HOST: http://ollama:11434
      VLM_MODEL: ${VLM_MODEL:-qwen3.5:4b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama:
    name: cashguard_ollama    # downloaded models, created before the rename to PhantomGuard
