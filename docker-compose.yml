# CashGuard — base stack (backend + demo analyzer, no GPU). Works on Mac, Linux and Windows.
#   docker compose up -d --build                         -> http://127.0.0.1:8000
#   docker compose --profile tunnel up -d                -> + public https://*.trycloudflare.com address
# Real model on an NVIDIA GPU (Windows / Linux): add the override file, see deploy/DOCKER.md
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
name: cashguard

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        WITH_ML: "0"
    image: cashguard-app:cpu
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE_DIR: /app/storage
      ANALYZER: ${ANALYZER_DOCKER:-mock}
    volumes:
      - storage:/app/storage
    ports:
      - "${PORT:-8000}:8000"
    shm_size: 1gb
    restart: unless-stopped
    stop_grace_period: 30s

  cloudflared:
    # quick tunnel: random https://<words>.trycloudflare.com, changes on every restart
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on: [app]
    restart: unless-stopped

  cloudflared-named:
    # named tunnel with a fixed domain: CLOUDFLARE_TUNNEL_TOKEN in .env, public hostname -> http://app:8000
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel-named]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app]
    restart: unless-stopped

volumes:
  storage: {}
