# База правил: тип нарушения -> визуальный признак -> норма.
# Единственный источник правды для типов, описаний и ссылок на НПА.
# Ссылки проверены по текстам актов (zakon.uchet.kz, редакции на 07.2026).
# quote  = дословный фрагмент акта; paraphrase = пересказ (сверить с adilet перед сдачей).
# Где публичной прямой нормы нет, это сказано в caveat — не выдумываем ссылки (критерий 4).

sources:
  NB231:
    label: "Правила кассовых операций (НБРК № 231)"
    short: "Правила осуществления кассовых операций и операций по инкассации (постановление Правления НБРК от 29.11.2019 № 231)"
    title: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей"
    act: "Постановление Правления Национального Банка РК от 29.11.2019 № 231 (рег. МЮ № 19680)"
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
  NB14:
    label: "Правила охраны и устройства помещений (НБРК № 14)"
    short: "Правила организации охраны и устройства помещений банков (постановление Правления НБРК от 24.02.2020 № 14)"
    title: "Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов РК, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация, и обменных пунктов"
    act: "Постановление Правления Национального Банка РК от 24.02.2020 № 14 (рег. МЮ № 20075)"
    url: "https://adilet.zan.kz/rus/docs/V2000020075"
    note: "п. 11, 13(3), 14, 16 приостановлены до 01.01.2027 — действует редакция, указанная после примечания"
  ARDFM53:
    label: "Требования к ИБ банков (АРРФР № 53)"
    short: "Требования к обеспечению информационной безопасности банков (постановление Правления АРРФР от 03.04.2026 № 53)"
    title: "Требования к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики Казахстан и организаций, осуществляющих отдельные виды банковских операций"
    act: "Постановление Правления АРРФР от 03.04.2026 № 53 (рег. МЮ № 38336); заменило постановление НБРК № 48 от 27.03.2018"
    url: "https://adilet.zan.kz/rus/docs/V2600038336"
  AML191:
    label: "Закон № 191-IV о ПОД/ФТ"
    short: "Закон РК от 28.08.2009 № 191-IV о противодействии легализации доходов и финансированию терроризма"
    title: "О противодействии легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения"
    act: "Закон РК от 28.08.2009 № 191-IV"
    url: "https://adilet.zan.kz/rus/docs/Z090000191_"
  INTERNAL:
    label: "Внутренний регламент банка"
    short: "Внутренние требования банка (публичный нормативный источник не установлен)"
    title: "Внутренний регламент кассового работника"
    act: "—"
    url: ""

violations:
  T01:
    type_name: "Компьютер не заблокирован при уходе с рабочего места"
    visual: "кассир уходит от стола или из кассы, экран ноутбука/монитора остаётся включённым и не заблокированным"
    why: "незаблокированная рабочая станция без присмотра создаёт риск несанкционированного доступа к банковским системам"
    timecode: "момент, когда кассир встаёт и начинает уходить"
    refs:
      - {src: ARDFM53, point: "п. 71 пп. 9", quote: "при неактивности пользователя более 30 (тридцати) минут информационная система автоматически завершает сеанс работы либо блокирует рабочую станцию или ноутбук"}
    norm_kind: indirect
    caveat: "Публичная норма требует автоблокировку через 30 мин; ручная блокировка при уходе — внутренняя политика ИБ банка."
  T02:
    type_name: "Наличные или ценности оставлены на рабочем месте без присмотра"
    visual: "кассир уходит, на столе остаются деньги, инкассаторская сумка, документы"
    why: "наличные должны храниться в запираемых устройствах, а кассир не должен оставлять их без присмотра"
    timecode: "момент ухода от стола"
    refs:
      - {src: NB231, point: "п. 20", quote: "Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника"}
      - {src: NB231, point: "п. 22", quote: "Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента."}
    norm_kind: direct
  T03:
    type_name: "Сейф оставлен открытым без присмотра"
    visual: "дверца сейфа открыта, кассир отошёл или сидит за столом и не работает с сейфом"
    why: "хранилища ценностей должны быть закрыты на ключ, доступ к ним — исключать несанкционированное использование"
    timecode: "момент, когда кассир отходит от открытого сейфа"
    refs:
      - {src: NB231, point: "п. 20", quote: "специальных устройствах, находящихся на рабочем месте кассового работника"}
      - {src: NB231, point: "п. 80", quote: "обеспечивающими исключение их несанкционированного использования"}
    norm_kind: direct
  T04:
    type_name: "Дверь кассового помещения не закрыта"
    visual: "кассир вошёл или вышел, дверь кассы осталась открытой"
    why: "кассовый узел должен быть изолирован и иметь закрывающийся вход"
    timecode: "момент прохода через дверь"
    refs:
      - {src: NB14, point: "п. 8", quote: "Кассовый узел подлежит изолированию"}
      - {src: NB14, point: "п. 16 пп. 1", quote: "каждая касса имеет отдельный вход с закрывающейся на замок дверью"}
    norm_kind: direct
  T05:
    type_name: "Постороннее лицо в кассовом помещении"
    visual: "в кассу входит человек, который не является обслуживаемым клиентом или инкассатором, или подходит к кассиру со служебной стороны"
    why: "доступ в кассовый узел ограничен лицами, ответственными за сохранность ценностей"
    timecode: "момент входа или подхода к рабочему месту"
    refs:
      - {src: NB14, point: "п. 8", quote: "Кассовый узел подлежит изолированию"}
      - {src: NB231, point: "п. 75", quote: "Вход в кладовую и (или) сейфовую комнату разрешается лицам, ответственным за сохранность наличных денег"}
    norm_kind: direct
  T06:
    type_name: "Приём наличных без предъявления документа, удостоверяющего личность"
    visual: "клиент сразу передаёт деньги; передачи и проверки удостоверения на видео не видно"
    why: "до приёма наличных кассир проводит визуальную идентификацию клиента по документу"
    timecode: "момент, когда кассир принимает деньги"
    refs:
      - {src: NB231, point: "п. 19 пп. 1", quote: "проводит визуальную идентификацию клиента, вносящего наличные деньги, с документом, удостоверяющим его личность"}
      - {src: NB231, point: "п. 31 пп. 1", quote: "проводит визуальную идентификацию клиента по данным документа, удостоверяющего личность"}
      - {src: AML191, point: "ст. 5 п. 2 пп. 2", quote: "осуществления операций с деньгами и (или) иным имуществом, в том числе подозрительных операций"}
    norm_kind: direct
    caveat: "Документ мог быть предъявлен вне кадра или в цифровом виде — писать «на видео не зафиксировано»."
  T07:
    type_name: "Наличные предыдущего клиента не убраны при обслуживании следующего"
    visual: "предыдущий клиент ушёл, деньги остались на столе, входит следующий клиент"
    why: "на рабочем месте должны находиться только наличные обслуживаемого клиента, ранее принятые — в запираемых устройствах"
    timecode: "вход следующего клиента"
    refs:
      - {src: NB231, point: "п. 20", quote: "На рабочем месте кассового работника находятся наличные деньги клиента."}
    norm_kind: direct
  T08:
    type_name: "Одновременная работа с наличными разных клиентов"
    visual: "на столе деньги предыдущего клиента, кассир принимает или пересчитывает деньги нового"
    why: "наличные принимаются по каждому кассовому документу отдельно, смешение создаёт риск ошибки и недостачи"
    timecode: "начало пересчёта денег нового клиента"
    refs:
      - {src: NB231, point: "п. 21", quote: "кассовый работник принимает наличные деньги по каждому приходному кассовому документу отдельно."}
    norm_kind: direct
  T09:
    type_name: "Операция с наличными не завершена в присутствии клиента"
    visual: "клиент уходит, кассир продолжает пересчитывать его деньги"
    why: "наличные принимаются и пересчитываются в присутствии клиента"
    timecode: "момент ухода клиента"
    refs:
      - {src: NB231, point: "п. 20", quote: "Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента."}
    norm_kind: direct
  T10:
    type_name: "Возврат клиенту банкноты, отделённой при проверке"
    visual: "после счётной машины или осмотра кассир отделяет купюру и передаёт её обратно клиенту"
    why: "сомнительные банкноты направляются на экспертизу, банкноты с признаками подделки клиенту не возвращаются"
    timecode: "момент передачи купюры клиенту"
    refs:
      - {src: NB231, point: "п. 59", quote: "При обнаружении сомнительных банкнот и монет кассовый работник в присутствии клиента"}
      - {src: NB231, point: "п. 61", quote: "Банкноты и монеты, имеющие признаки подделки, клиенту не возвращаются"}
    norm_kind: direct
    caveat: "По видео нельзя установить, что купюра сомнительная — только факт отделения и возврата."
  T11:
    type_name: "Приём сумки от инкассатора без оформления"
    visual: "инкассатор оставляет сумку и уходит; передачи и проверки документов не видно"
    why: "сумку принимают по препроводительному документу с проверкой целостности и пломб"
    timecode: "момент передачи сумки"
    refs:
      - {src: NB231, point: "п. 24", quote: "проверяет целостность сумки; проверяет правильность пломбирования сумки."}
    norm_kind: direct
  T12:
    type_name: "Ценности помещены в сейф без пересчёта"
    visual: "сумки вскрыты, пачки сразу уносятся в сейф; пересчёта и счётной машины не видно"
    why: "пересчёт вложений выполняется до помещения ценностей на хранение"
    timecode: "момент открытия сейфа с непересчитанными деньгами"
    refs:
      - {src: NB231, point: "п. 42", quote: "Кассовые операции по пересчету, сортировке и упаковке наличных денег осуществляются кассовым работником"}
      - {src: NB231, point: "п. 74", quote: "Банки обеспечивают хранение наличных денег в кладовых и (или) сейфовой комнате"}
    norm_kind: indirect
    caveat: "Прямого запрета «в сейф без пересчёта» в Правилах нет: п. 74 требует хранить наличные после их учёта в автоматизированной системе, п. 42 — пересчитывать их кассовым работником. По видео видно только, что пересчёта до сейфа не было."
  T13:
    type_name: "Личные вещи на рабочем месте кассира"
    visual: "сумка, рюкзак, верхняя одежда на рабочем столе кассира"
    why: "личные вещи работников хранятся вне кассового узла"
    timecode: "момент, когда вещи положены на стол"
    refs:
      - {src: NB231, point: "п. 12", quote: "Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла"}
    norm_kind: direct
  T14:
    type_name: "Приём пищи или напитков на рабочем месте при работе с наличными"
    visual: "кассир ест или пьёт, рядом лежат наличные"
    why: "еда и напитки на рабочем месте создают риск порчи ценностей и отвлечения"
    timecode: "момент, когда кассир подносит еду или напиток"
    refs:
      - {src: INTERNAL, point: "", paraphrase: "внутренний регламент кассового работника; ближайшая публичная норма — п. 12 Правил № 231 (что допускается вносить в кассовый узел)"}
    norm_kind: internal
  T15:
    type_name: "Смартфон в кассовом помещении"
    visual: "кассир держит или использует мобильный телефон (смартфон с камерой)"
    why: "в кассовый узел допускаются только средства связи без функции фото- и видеофиксации"
    timecode: "первое появление телефона в руках"
    refs:
      - {src: NB231, point: "п. 12", quote: "средств связи, не имеющих функции фото и видео фиксации"}
    norm_kind: direct
  T16:
    type_name: "Кассир покинул рабочее место во время обслуживания клиента"
    visual: "клиент сидит или стоит у стола напротив, а место кассира пустое: кассир ушёл, не завершив обслуживание"
    why: "кассовому работнику запрещено покидать рабочее место до окончания обслуживания клиента; клиент и наличные остаются без контроля"
    timecode: "момент, когда кассир встаёт и уходит при клиенте"
    refs:
      - {src: NB231, point: "п. 22", quote: "Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента."}
    norm_kind: direct
    caveat: "По видео нельзя установить, завершена ли операция в системе, — только что клиент остаётся у стола без кассира."
