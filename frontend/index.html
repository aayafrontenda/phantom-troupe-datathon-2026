<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1,viewport-fit=cover"
		/>
		<title>PhantomGuard</title>
		<meta
			name="description"
			content="PhantomGuard - видеоконтроль кассовой дисциплины ForteBank. Локальный ИИ, решение за человеком."
		/>
		<meta
			name="theme-color"
			content="#F4F4F5"
			media="(prefers-color-scheme: light)"
		/>
		<meta
			name="theme-color"
			content="#0F0F12"
			media="(prefers-color-scheme: dark)"
		/>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link
			rel="preload"
			href="/fonts/golos-cyrillic.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/golos-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			try {
				var t = localStorage.getItem("cg_theme");
				if (t) document.documentElement.dataset.theme = t;
				var l = localStorage.getItem("cg_lang");
				if (l) document.documentElement.lang = l;
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
