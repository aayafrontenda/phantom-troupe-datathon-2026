<!doctype html>

<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23C8235F'/%3E%3Ccircle cx='12' cy='12' r='6' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>

<header class="top">
  <a class="brand" href="/" data-nav="checks">
    <span class="lens" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/></svg></span>
    <b>CashGuard</b>
  </a>
  <nav class="tabs" aria-label="Sections" data-i18n-aria="nav.sections">
    <a href="/" class="tab" data-nav="checks"><span data-i18n="nav.checks">Checks</span></a>
    <a href="/?view=live" class="tab" data-nav="live"><span data-i18n="nav.live">Live monitoring</span> <span class="badge" id="alertBadge" hidden></span></a>
    <a href="/?view=rules" class="tab" data-nav="rules"><span data-i18n="nav.rules">Rules</span></a>
  </nav>
  <div class="top-right">
    <span class="status" id="status" data-i18n-title="status.title"><i class="dot"></i><span data-i18n="status.connecting">Connecting…</span></span>
    <div class="lang-sw" role="group" aria-label="Language" data-i18n-aria="lang"><button data-lang="ru" lang="ru">РУС</button><button data-lang="kk" lang="kk">ҚАЗ</button><button data-lang="en" lang="en">ENG</button></div>
    <button class="icon-btn ghost" id="themeBtn" aria-label="Switch theme" data-i18n-aria="theme" data-i18n-title="theme"><svg class="i"><use href="#i-moon"/></svg></button>
  </div>
</header>

<main id="main"></main>

<div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" id="modalCard"></div></div>
<div class="lightbox" id="lightbox" hidden><img alt="Evidence frame"><div class="lb-cap mono" id="lbCap"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>

</html>
