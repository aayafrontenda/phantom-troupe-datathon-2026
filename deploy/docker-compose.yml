# docker compose -f deploy/docker-compose.yml up -d            # CPU / mock
# docker compose -f deploy/docker-compose.yml --profile gpu --profile vlm up -d   # NVIDIA + Ollama
# docker compose -f deploy/docker-compose.yml --profile public up -d              # + Cloudflare tunnel
#
# Settings come from ../.env (same file deploy/run_server.* use). The analyzer never needs the internet:
# `app` sits on an internal-only network (reaches just `ollama`); `cloudflared` bridges it to the public URL,
# `weights` (profile) is the only way model files get in:  docker compose --profile weights run --rm weights
name: cashguard

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        WITH_ML: "${WITH_ML:-0}"
        BASE: "${DOCKER_BASE:-python:3.11-slim}"
    env_file:
      - path: ../.env
        required: false
    environment:
      STORAGE_DIR: /app/storage
      VLM_URL: ${VLM_URL:-http://ollama:11434}
      HF_HOME: /app/models/hf
    volumes:
      - storage:/app/storage
      - models:/app/models
    ports:
      - "${PORT:-8000}:8000"
    networks: [internal]          # no internet: models must already be in the `models` volume (see `weights`)
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-8g}

  app-gpu:
    extends: app
    profiles: [gpu]
    build:
      args:
        WITH_ML: "1"
        BASE: "${DOCKER_BASE:-nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04}"
    environment:
      ANALYZER: ml
      DETECTOR_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  weights:
    # one-off: downloads detector weights into the shared `models` volume (the only service with internet)
    extends: app
    profiles: [weights]
    networks: [egress]
    ports: []
    restart: "no"
    environment:
      HF_HUB_OFFLINE: "0"
    command: ["python3", "-c", "from ml.detector import get_detector; get_detector(); print('weights ready')"]

  ollama:
    image: ollama/ollama:0.6.5
    profiles: [vlm]
    volumes:
      - ollama:/root/.ollama
    networks: [internal]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  cloudflared:
    image: cloudflare/cloudflared:2025.2.0
    profiles: [public]
    command: tunnel --no-autoupdate --url http://app:8000
    networks: [internal, egress]
    restart: unless-stopped
    depends_on: [app]

networks:
  internal:
    internal: true        # no route to the internet: locality enforced by infrastructure
  egress: {}

volumes:
  storage: {}
  models: {}
  ollama: {}
